<!DOCTYPE html>
<html lang="en">
<head>
	<title>Student Registration Form</title>
	<style>
		body{
			font-family:sans serif;
			background-color:#f0f4f8
			padding:40px;
			margin:0;
			}
		h1{
			color:#1a202c;
			font-size:1.6rem;
			margin-bottom:24px;
			}
	</style>
</head>
	<body>
		<h1>Student Registration Form</h1>
		<form>
			<label>Full Name</label>
			<input type="text" placeholder="Enter your full name"></input>
			<br><br>
		
			<label>Email</label>
			<input type="email" placeholder="Enter your email address"></input>
			<br><br>
		
			<label>Password</label>
			<input type="password" placeholder="Minimum 8 characters"></input>
			<br><br>
			
			<label>Age</label>
			<input type="number" placeholder="Your age"></input>
			<br><br>
			
			<label>Phone Number</label>
			<input type="tel" placeholder="+94775831652"></input>
			<br><br>
			
			<p>Gender</p>
			<label>
				<input type="radio" name="gender"></input>
				Female
			</label>
			<label>
				<input type="radio"name="gender"></input>
				Male
			</label>
				<label>
				<input type="radio"name="gender"></input>
				Prefer not to say
			</label>
			
			<p>Skills</p>
			<label>
				<input type="checkbox"name="skills"></input>
				HTML
			</label>
			
			
			<label>
				<input type="checkbox"name="skills"></input>
				C++
			</label>
			
			
			<label>
				<input type="checkbox"name="skills"></input>
				C#
			</label>
			
			
			<label>
				<input type="checkbox"name="skills"></input>
				JAVA
			</label>
			
		
			<label>
				<input type="checkbox"name="skills"></input>
				PYTHON
			</label>
			
			<br>
			<br>
			<label>Year of Study</label>
			<select name="year">
				<option>Select Year</option>
				<option>First Year</option>
				<option>Second Year</option>
				<option>Third Year</option>
				<option>Fourth Year</option>	
			</select>
		    <br>
			<br>
			<label>About You</label><br>
			<textarea rows="5" placeholder="Tell us a bit about yourself...."></textarea>
			
			
			
			<br>
			<button type="submit">Submit</button>
		
		


		
		</form>
 </body>
 </html>
