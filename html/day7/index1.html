<!DOCTYPE HTML>
<html>
<head>
<title>Navigation</title>
	<style>
		ul{
			list-style:none;
			padding:0;
			margin:0;
		}
		a{
			text-decoration:none;
			padding:5px;
		}
		li{
			display:inline;
			margin-right:40px;
		}
		nav{
			background-color:lightblue;
			padding:20px;
			font-size:30px;
		}
		h1{
			background-color:yellow;
			color:purple;
		}
		a:hover {
			color:#f7c948;
		}
		
	</style>
</head>
<body>
	<h1>My Website</h1>
	<nav>
	   <ul>
		<li><a href="#">Home</a></li>
		<li><a href="#">About</a></li>
		<li><a href="#">Services</a></li>
		<li><a href="#">Contact</a></li>
		
	   </ul>
	</nav>
	
</body>






</html>
